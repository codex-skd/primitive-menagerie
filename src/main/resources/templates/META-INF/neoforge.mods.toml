modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://gitlab.com/stalking-dragons/minecraft/primitive-menagerie"
credits="Port of Primitive Mobs (CC BY-NC 3.0) by Daveyx0. Models by KodaichiZero (spider family, creepers, brain slime), Gibea (traveling merchant) and TehPhailed (blazing juggernaut), as credited by the original. The original work has been modified (ported to NeoForge 1.21.1). Port by Stalking Dragons."
authors="Stalking Dragons; original Primitive Mobs by Daveyx0"
description='''A menagerie of familiar, sometimes goofy creatures: skeleton warriors, haunted tools, support creepers, treasure slimes, mimics, goblins, yetis and many more. A NeoForge 1.21.1 port of Primitive Mobs by Daveyx0.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mobweave_core"
    type="required"
    versionRange="[0.0.0-beta.1,)"
    ordering="AFTER"
    side="BOTH"
